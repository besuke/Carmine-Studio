<p class="eyebrow">2　二人の子ども</p>
<h2>どちらの観測も正確。それでも答えは変わる</h2>
<div class="row">
<div class="card">
<p class="label">手順 A</p>
<h3>少なくとも一人が女の子の家庭を選ぶ</h3>
<p class="num">1/3</p>
<p class="cap">二人とも女の子である確率</p>
</div>
<div class="card">
<p class="label">手順 B</p>
<h3>家庭から子どもを無作為に一人選ぶと、女の子だった</h3>
<p class="num">1/2</p>
<p class="cap">二人とも女の子である確率</p>
</div>
</div>
<p class="note">各子どもの男女は独立・等確率とする。男女の判定に誤りがありうるなら、誤判定率もベイズ計算に入る。</p>
<aside>観測は正確でも、情報を得る手順が違えば答えが変わる。さらに報告そのものが不正確なら、誤判定率もベイズ計算に入れる必要がある。</aside>
</section>
