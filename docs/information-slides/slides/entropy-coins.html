<section id="entropy-coins" class="paper" data-transition="fade">
<p class="eyebrow">4　確率の問いとエントロピー</p>
<h2>平均では足りても、最悪の枝が足りない</h2>
<div class="row">
<div class="card">
<p class="label">初回の量り（4対4）の結果</p>
<p class="num">1.577</p>
<p class="cap">ビット。最大は 1.585 で、ほぼ使い切っている。</p>
</div>
<div class="card">
<p class="label">釣り合いの枝に残る不確かさ</p>
<p class="num">3.322</p>
<p class="cap">ビット（log2 10）。残り2回で得られる上限は 3.170 ビット。</p>
</div>
</div>
<p class="note">初回の結果は 8・8・10 通りに分かれる。10 通りが残る枝は、残り2回では区別しきれない。</p>
<aside>結果の確率は 8/26、8/26、10/26。平均の情報量は上限に近いが、最悪の枝で見ると足りない。これが、情報量の見積もりだけでは「できる」と言えない理由。</aside>
</section>
