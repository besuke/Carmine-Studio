<section id="halting" class="ink" data-transition="fade">
<p class="eyebrow">5　形式化と、その限界</p>
<h2>チューリング：機械で決められない問いがある</h2>
<div class="row">
<div class="card">
<p class="label">停止問題</p>
<p class="cap">任意のプログラムと入力について、止まるかどうかを必ず正しく答える一般的な手続きは存在しない。</p>
</div>
<div class="card">
<p class="label">決定問題</p>
<p class="cap">数学の命題が証明できるかどうかを、一般に機械的に判定する手続きも存在しない。</p>
</div>
</div>
<p class="note">機械にできることには、はっきりした限界がある。</p>
<aside>決定不能性。ヒルベルトの問い（命題が証明できるかを機械的に決められるか）に対する、否定的な答え。</aside>
</section>
