<section id="monty-rules" class="paper" data-transition="fade">
<p class="eyebrow">1　モンティ・ホール</p>
<h2>標準設定では、交換の勝率は 2/3</h2>
<div class="split">
<div class="col">
<ul class="list">
<li>3枚の扉に、車が1台、ヤギが2匹</li>
<li>司会者は車の場所を知っている</li>
<li>選ばれていない扉から、必ずヤギを見せる</li>
<li>必ず、交換を提案する</li>
</ul>
<p class="body">最初にヤギを選んだ場合に交換で勝つ。最初にヤギを選ぶ確率が 2/3 なので、交換の勝率も 2/3 になる。</p>
</div>
<div class="card side">
<p class="label">交換したときの勝率</p>
<p class="num">2/3</p>
<p class="cap">最初にヤギを選ぶ確率と同じ</p>
</div>
</div>
<aside>ポイントは「司会者が何を知っていて、どういうルールでヤギを見せるか」。このルールが観測を生んでいる。</aside>
</section>
