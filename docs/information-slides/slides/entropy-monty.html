<p class="eyebrow">4　確率の問いとエントロピー</p>
<h2>モンティ・ホールを、ビットで見る</h2>
<p class="lead" style="margin-bottom:36px">車の場所の不確かさは、最初は log2 3 ＝ 1.585 ビット。</p>
<div class="row">
<div class="card">
<p class="label">標準設定の場合に残る不確かさ</p>
<p class="num">0.918</p>
<p class="cap">ビット。得た情報は 0.667 ビット。</p>
</div>
<div class="card">
<p class="label">司会者が偶然ヤギを開けた場合に残る不確かさ</p>
<p class="num">1.000</p>
<p class="cap">ビット。得た情報は 0.585 ビット。</p>
</div>
</div>
<p class="note">同じ「ヤギが見えた」でも、ルールが違えば得る情報が違う。</p>
<aside>標準設定では残りの 2 枚が 1/3 と 2/3、偶然開けた場合は 1/2 と 1/2。情報量は、観測の中身だけでなく、観測が生まれたルールで決まる。</aside>
</section>
