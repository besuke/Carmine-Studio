<h2>命題を型として読む</h2>
<table class="tbl32">
<tr class="thead"><th style="width:40%">論理</th><th style="width:60%">型とプログラム</th></tr>
<tr><td>A ならば B</td><td>関数の型 A → B</td></tr>
<tr class="alt"><td>A かつ B</td><td>組の型 A × B</td></tr>
<tr><td>A または B</td><td>和の型（A か B のどちらか）</td></tr>
<tr class="alt"><td>命題の証明</td><td>その型をもつ項（プログラム）</td></tr>
</table>
<p class="note">証明が正しいか調べることは、項の型を検査することになる。</p>
<aside>命題と型、証明と項の対応。証明を「プログラムを書くこと」として読めるのが、カリー＝ハワード対応。</aside>
</section>
