<p class="eyebrow">4　確率の問いとエントロピー</p>
<h2>あみだくじは公正か</h2>
<ul class="list">
<li>横線は隣り合う二本を入れ替えるだけなので、結果は必ず一対一になる</li>
<li>ただし、どの結果も等確率になるとは限らない</li>
</ul>
<p class="body" style="margin-bottom:24px">例：縦線3本に、横線を1本だけ。隣り合う2本のどちらかに、等確率で引く。</p>
<table class="tbl32">
<tr class="thead"><th style="width:25%">出発＼結果</th><th style="width:25%">結果 1</th><th style="width:25%">結果 2</th><th style="width:25%">結果 3</th></tr>
<tr><td>出発 1</td><td>1/2</td><td>1/2</td><td>0</td></tr>
<tr class="alt"><td>出発 2</td><td>1/2</td><td>0</td><td>1/2</td></tr>
<tr><td>出発 3</td><td>0</td><td>1/2</td><td>1/2</td></tr>
</table>
<p class="note">出発 1 は結果 3 に着けない。公正なら、どれも 1/3 ずつのはず。</p>
<aside>一対一であることと、等確率であることは別。さらに、横線を見てから出発点を選べるなら、それは観測を使った選択になる。</aside>
</section>
