<section id="entropy" class="paper" data-transition="fade">
<p class="eyebrow">3　13枚のコイン</p>
<h2>シャノンの情報エントロピーで見る</h2>
<div class="row">
<div class="card">
<p class="label">初期の不確かさ</p>
<p class="num">4.70</p>
<p class="cap">ビット（log2 26）。26通りを等確率と置く</p>
</div>
<div class="card">
<p class="label">3回の天秤で区別できる量</p>
<p class="num">4.75</p>
<p class="cap">ビット（3 × log2 3 ＝ log2 27）。最大</p>
</div>
</div>
<p class="note">情報量は足りている。それでも解けないのは、天秤という道具では、初回に仮説を必要な形に分けられないから。</p>
<aside>情報量の上限だけでは「できる」とは言えない。実際にできる観測の形が、解けるかどうかを決める。数値は小数第3位を四捨五入。</aside>
</section>
