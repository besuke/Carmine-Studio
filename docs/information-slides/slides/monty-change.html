<section id="monty-change" class="ink" data-transition="fade">
<p class="eyebrow">1　モンティ・ホール</p>
<h2>司会者が事情を知らず、偶然ヤギが出たら？</h2>
<div class="row">
<div class="card">
<p class="label">標準設定</p>
<h3>司会者は車の場所を知っている</h3>
<p class="cap">ヤギが見えたのは、ルールでそうなっているから</p>
</div>
<div class="card">
<p class="label">条件を変える</p>
<h3>司会者は事情を知らない</h3>
<p class="cap">ヤギが見えたのは、たまたま</p>
</div>
</div>
<p class="note">扉の向こうに見えたものと、その扉が開けられた理由。この両方が効いてくる。</p>
<aside>補足：司会者が偶然ヤギを開けた場合、交換しても勝率は 1/2 になる（標準設定の 2/3 とは異なる）。観測の中身が同じでも、観測が生まれた理由で答えが変わる。</aside>
</section>
