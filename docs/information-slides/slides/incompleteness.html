<section id="incompleteness" class="paper" data-transition="fade">
<p class="eyebrow">5　形式化と、その限界</p>
<h2>ゲーデル：形式体系の中だけでは言い尽くせない</h2>
<div class="row">
<div class="card">
<p class="label">第一不完全性定理</p>
<p class="cap">算術を含み、公理を機械的に並べられる無矛盾な体系には、その中で証明も反証もできない命題がある。</p>
</div>
<div class="card">
<p class="label">第二不完全性定理</p>
<p class="cap">そのような体系は、自分自身の無矛盾性を、その体系の中では証明できない。</p>
</div>
</div>
<p class="note">できないのは「すべてを一つの体系で言い尽くすこと」。個別の定理を証明することではない。</p>
<aside>不完全性は、形式化が無意味だという話ではない。体系の外から見ないと分からないことがある、という話。</aside>
</section>
